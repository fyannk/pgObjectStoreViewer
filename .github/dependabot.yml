version: 2

updates:
  # The api/ module is intentionally absent: make check-api requires it to
  # remain free of external dependencies.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      go-routine-updates:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      docusaurus:
        applies-to: version-updates
        patterns:
          - "@docusaurus/*"
      npm-routine-updates:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - "@docusaurus/*"
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      container-routine-updates:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:45"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions-routine-updates:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Keep the frozen 0.1 line current as well. Dependabot security updates always
  # target the default branch, so security fixes are reviewed on main and then
  # backported; these entries provide version updates directly to release-0.1.
  - package-ecosystem: gomod
    directory: /
    target-branch: release-0.1
    schedule:
      interval: weekly
      day: tuesday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      release-0-1-go-updates:
        applies-to: version-updates
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /web
    target-branch: release-0.1
    schedule:
      interval: weekly
      day: tuesday
      time: "06:15"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      release-0-1-docusaurus:
        applies-to: version-updates
        patterns:
          - "@docusaurus/*"
      release-0-1-npm-updates:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - "@docusaurus/*"

  - package-ecosystem: docker
    directory: /
    target-branch: release-0.1
    schedule:
      interval: weekly
      day: tuesday
      time: "06:30"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      release-0-1-container-updates:
        applies-to: version-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    target-branch: release-0.1
    schedule:
      interval: weekly
      day: tuesday
      time: "06:45"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
    groups:
      release-0-1-actions-updates:
        applies-to: version-updates
        patterns:
          - "*"
